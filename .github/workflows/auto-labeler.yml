name: auto-labeler

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  auto-labeler:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: platform-mesh/.github/.github/workflows/job-auto-labeler.yml@ab6caea57060a3eba5fc58cadbb2aaa1b06da18a
    permissions:
      contents: read # Needed to read repository contents
      pull-requests: write # Needed to add labels to pull requests
      issues: write # Needed to manage labels used by the auto-labeler

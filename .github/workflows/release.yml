name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    uses: platform-mesh/.github/.github/workflows/job-tag-version.yml@6d83f6cdb7db9f0afe531556b1a753d81d3c5844
    permissions:
      contents: read

  test:
    needs: [version]
    uses: platform-mesh/.github/.github/workflows/job-node-test.yml@6d83f6cdb7db9f0afe531556b1a753d81d3c5844
    secrets: inherit # zizmor: ignore[secrets-inherit]

  docker-build-push:
    needs: [version, test]
    uses: platform-mesh/.github/.github/workflows/job-docker-build-push.yml@6d83f6cdb7db9f0afe531556b1a753d81d3c5844
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      contents: write # Needed to update release artifacts
      packages: write # Needed to push the container image to GHCR
      id-token: write # Needed for OIDC-based image signing
    with:
      imageTagName: ghcr.io/platform-mesh/portal
      version: ${{ needs.version.outputs.tag }}
      multiarch: true
      createRelease: false

  update-version:
    needs: [version, docker-build-push]
    if: ${{ needs.version.outputs.latest == 'true' }}
    uses: platform-mesh/.github/.github/workflows/job-chart-version-update.yml@6d83f6cdb7db9f0afe531556b1a753d81d3c5844
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      appVersion: ${{ needs.version.outputs.tag }}
      chart: portal
      targetRepository: platform-mesh/platform-mesh

  sbom:
    needs: [version, docker-build-push]
    uses: platform-mesh/.github/.github/workflows/job-sbom.yml@6d83f6cdb7db9f0afe531556b1a753d81d3c5844
    permissions:
      contents: read # Needed to read repository contents
      packages: read # Needed to pull the image to generate the SBOM
    with:
      imageReference: ghcr.io/platform-mesh/portal:${{ needs.version.outputs.tag }}

  image-ocm:
    needs: [version, docker-build-push, sbom]
    uses: platform-mesh/.github/.github/workflows/job-image-ocm.yml@6d83f6cdb7db9f0afe531556b1a753d81d3c5844
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      contents: read # Needed to read repository contents
      packages: write # Needed to push the OCM component image to GHCR
    with:
      imageReference: ghcr.io/platform-mesh/portal:${{ needs.version.outputs.tag }}
      appVersion: ${{ needs.version.outputs.tag }}
      repoName: portal
      commit: ${{ github.sha }}

  scan-sbom:
    needs: [version, docker-build-push, sbom, image-ocm]
    uses: platform-mesh/.github/.github/workflows/job-trivy-sbom.yml@6d83f6cdb7db9f0afe531556b1a753d81d3c5844
    permissions:
      contents: read # Needed to read repository contents
      packages: read # Needed to pull the image referenced by the SBOM
      security-events: write # Needed to upload Trivy results to code scanning
    with:
      componentVersion: ${{ needs.version.outputs.tag }}

  github-release:
    needs: [version, docker-build-push]
    uses: platform-mesh/.github/.github/workflows/job-github-release.yml@6d83f6cdb7db9f0afe531556b1a753d81d3c5844
    permissions:
      contents: write # Needed to create the GitHub release
    with:
      tag: ${{ needs.version.outputs.tag }}
      previousTag: ${{ needs.version.outputs.previousTag }}
      prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
      latest: ${{ needs.version.outputs.latest == 'true' }}

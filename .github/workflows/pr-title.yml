name: pr-title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    uses: platform-mesh/.github/.github/workflows/job-pr-title.yml@15b291d550257bc590a89917bfbbe0e30bf08895
